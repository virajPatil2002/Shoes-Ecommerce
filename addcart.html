<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <section class="py-5 bg-white">
        <div class="container">
            <h2 class="mb-4 fw-bold">Your Shopping Cart</h2>
            <div class="table-responsive">
                <table class="table align-middle" id="cart-table">
                    <thead class="table-dark">
                        <tr>
                            <th>Product</th>
                            <th class="text-center">Price</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-center">Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body"></tbody>
                </table>
            </div>
            <div class="row mt-4">
                <div class="col-md-6">
                    <a href="./product.html" class="btn btn-outline-secondary">Continue Shopping</a>
                </div>
                <div class="col-md-6 text-end">
                    <h5 class="fw-bold">Subtotal: $<span id="subtotal">0.00</span></h5>
                    <a href="./payment.html" class="btn btn-success btn-lg mt-2">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </section>

    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const cartBody = document.getElementById("cart-body");
        const subtotalEl = document.getElementById("subtotal");
        const checkoutBtn = document.querySelector(".btn-success");

        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        function updateCartDisplay() {

            cartBody.innerHTML = "";
            let subtotal = 0;

            // Empty Cart
            if (cart.length === 0) {

                cartBody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-5">
                    <h4>Your Cart is Empty 🛒</h4>
                    <a href="./product.html" class="btn btn-primary mt-3">
                        Continue Shopping
                    </a>
                </td>
            </tr>
        `;

                subtotalEl.textContent = "0.00";
                checkoutBtn.classList.add("disabled");
                checkoutBtn.setAttribute("aria-disabled", "true");

                saveCart();
                return;
            }

            checkoutBtn.classList.remove("disabled");
            checkoutBtn.removeAttribute("aria-disabled");

            cart.forEach((item, index) => {

                const total = item.price * item.quantity;
                subtotal += total;

                const row = document.createElement("tr");

                row.innerHTML = `
            <td>
                <div class="d-flex align-items-center">
                    <img src="${item.image}"
                         alt="${item.name}"
                         width="80"
                         height="80"
                         class="rounded border"
                         onerror="this.src='./images/no-image.png'">

                    <span class="ms-3 fw-semibold">
                        ${item.name}
                    </span>
                </div>
            </td>

            <td class="text-center">
                $${item.price.toFixed(2)}
            </td>

            <td class="text-center">

                <div class="d-flex justify-content-center align-items-center gap-2">

                    <button class="btn btn-sm btn-outline-secondary minus-btn"
                        data-index="${index}">
                        -
                    </button>

                    <span>${item.quantity}</span>

                    <button class="btn btn-sm btn-outline-secondary plus-btn"
                        data-index="${index}">
                        +
                    </button>

                </div>

            </td>

            <td class="text-center fw-bold">
                $${total.toFixed(2)}
            </td>

            <td class="text-center">

                <button
                    class="btn btn-danger btn-sm remove-btn"
                    data-index="${index}">
                    Remove
                </button>

            </td>
        `;

                cartBody.appendChild(row);

            });

            subtotalEl.textContent = subtotal.toFixed(2);

            saveCart();

            // Plus Button
            document.querySelectorAll(".plus-btn").forEach(btn => {

                btn.onclick = () => {

                    const index = btn.dataset.index;

                    cart[index].quantity++;

                    updateCartDisplay();

                };

            });

            // Minus Button
            document.querySelectorAll(".minus-btn").forEach(btn => {

                btn.onclick = () => {

                    const index = btn.dataset.index;

                    if (cart[index].quantity > 1) {

                        cart[index].quantity--;

                    } else {

                        cart.splice(index, 1);

                    }

                    updateCartDisplay();

                };

            });

            // Remove Button
            document.querySelectorAll(".remove-btn").forEach(btn => {

                btn.onclick = () => {

                    const index = btn.dataset.index;

                    cart.splice(index, 1);

                    updateCartDisplay();

                };

            });

        }

        updateCartDisplay();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
