<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Registration</title>

  <!-- ✅ Font Awesome CDN (NO 403 error) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4p1k5t6qfGx9kz4x0Q5Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 420px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
      padding: 30px;
      animation: fadeIn 0.5s ease;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid #eee;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
      font-weight: 600;
      color: #555;
      transition: 0.3s;
    }

    .tab-btn.active {
      color: #2575fc;
      border-bottom: 3px solid #2575fc;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
      color: #222;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #999;
    }

    .input-group input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .input-group input:focus {
      outline: none;
      border-color: #2575fc;
      box-shadow: 0 0 6px rgba(37, 117, 252, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #2575fc;
      color: #fff;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1a5dd6;
    }

    .error-msg {
      color: red;
      font-size: 13px;
      display: none;
      margin-bottom: 8px;
    }

    form {
      display: none;
      animation: fadeSlide 0.4s ease forwards;
    }

    form.active {
      display: block;
    }

    .toggle-link {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    .toggle-link a {
      color: #2575fc;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 450px) {
      .container {
        width: 100%;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="tabs">
      <div class="tab-btn active" onclick="showTab('login')">Login</div>
      <div class="tab-btn" onclick="showTab('register')">Register</div>
    </div>

    <form id="loginForm" class="active">
      <h2>Welcome Back</h2>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username" />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
      </div>

      <p class="error-msg" id="loginError">⚠ Invalid username or password</p>

      <button type="button" onclick="loginUser()">Login</button>

      <div class="toggle-link">
        Don't have an account? <a onclick="showTab('register')">Register</a>
      </div>
    </form>

    <form id="registerForm">
      <h2>Create Account</h2>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="regFirstName" placeholder="First Name" required />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="regLastName" placeholder="Last Name" required />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-user-circle"></i>
        <input type="text" id="regUsername" placeholder="Username" required autocomplete="username" />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="regPassword" placeholder="Password" required autocomplete="new-password" />
      </div>

      <p class="error-msg" id="regError">⚠ Please fill all fields</p>

      <button type="button" onclick="registerUser()">Register</button>

      <div class="toggle-link">
        Already registered? <a onclick="showTab('login')">Login</a>
      </div>
    </form>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll("form").forEach(f => f.classList.remove("active"));

      if (tab === "login") {
        document.querySelectorAll(".tab-btn")[0].classList.add("active");
        document.getElementById("loginForm").classList.add("active");
      } else {
        document.querySelectorAll(".tab-btn")[1].classList.add("active");
        document.getElementById("registerForm").classList.add("active");
      }
    }

    function registerUser() {
      const firstName = regFirstName.value.trim();
      const lastName = regLastName.value.trim();
      const username = regUsername.value.trim();
      const password = regPassword.value.trim();

      if (!firstName || !lastName || !username || !password) {
        regError.style.display = "block";
        return;
      }

      localStorage.setItem("user", JSON.stringify({ firstName, lastName, username, password }));
      alert("Registration successful!");
      showTab("login");
    }

    function loginUser() {
      const username = loginUsername.value.trim();
      const password = loginPassword.value.trim();
      const user = JSON.parse(localStorage.getItem("user"));

      if (user && user.username === username && user.password === password) {
        loginError.style.display = "none";
        alert("Login successful!");
        window.location.href = "index.html";
      } else {
        loginError.style.display = "block";
      }
    }
  </script>
</body>

</html>
