<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Vshoestore</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #212529;
    }

    a {
      text-decoration: none;
    }

    /* Cart Icon */
    .cart-icon {
      position: fixed;
      top: 20px;
      right: 25px;
      background: #0d6efd;
      color: #fff;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    .cart-icon:hover {
      transform: scale(1.1);
    }

    /* Product Section */
    .product-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      padding: 2rem;
    }

    .product-main-img {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      transition: transform 0.4s ease;
    }

    .product-main-img:hover {
      transform: scale(1.03);
    }

    .size-btn {
      margin: 5px;
      padding: 8px 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      background-color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .size-btn:hover {
      background-color: #e9ecef;
    }

    .size-btn.active {
      background-color: #0d6efd;
      color: #fff;
      border-color: #0d6efd;
    }

    /* Buy Now Button */
    .btn-buy {
      background: #198754;
      color: #fff;
      border-radius: 30px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-buy:hover {
      background: #146c43;
      transform: translateY(-1px);
    }

    /* Add to Cart Animated Button */
    .button {
      position: relative;
      border: none;
      background: #362A89;
      color: #fff;
      border-radius: 30px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      min-width: 150px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .button:active {
      transform: scale(0.97);
    }

    .button span {
      position: relative;
      z-index: 2;
      font-size: 15px;
    }

    .button.loading {
      background-color: #281f6b;
    }

    .flying-img {
      position: fixed;
      z-index: 9999;
      transition: all 1s ease-in-out;
      pointer-events: none;
    }

    .price-tag {
      color: #0d6efd;
      font-weight: 600;
      font-size: 1.4rem;
    }
  </style>
</head>

<body>
  <!-- Floating Cart Icon -->
  <div class="cart-icon" id="cartIcon">
    <i class="fa fa-shopping-cart"></i>
  </div>

  <!-- Main Section -->
  <div class="container py-5">
    <a href="product.html" class="btn btn-outline-secondary mb-4">
      <i class="fa fa-arrow-left me-2"></i>Back to Products
    </a>

    <div class="product-container">
      <div class="row g-5 align-items-center">
        <div class="col-md-6 text-center">
          <img id="mainImage" src="" alt="Product" class="product-main-img mb-3">
        </div>

        <div class="col-md-6">
          <h2 id="productName" class="fw-bold mb-2"></h2>
          <div id="productPrice" class="price-tag mb-3"></div>

          <h6 class="fw-bold mb-2">Select Size</h6>
          <div class="mb-3">
            <button class="size-btn" onclick="selectSize(this)">6</button>
            <button class="size-btn" onclick="selectSize(this)">7</button>
            <button class="size-btn" onclick="selectSize(this)">8</button>
            <button class="size-btn" onclick="selectSize(this)">9</button>
            <button class="size-btn" onclick="selectSize(this)">10</button>
          </div>

          <div class="d-flex gap-3 mt-4">
            <button class="button" id="addToCartBtn">
              <span>Add to Cart</span>
            </button>

            <button class="btn-buy" id="buyNowBtn">
              <i class="fa fa-bolt me-2"></i>Buy Now
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    let selectedSize = null;
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || 'Product Name';
    const price = params.get('price') || '0';
    const img = params.get('img') || 'https://via.placeholder.com/450x450.png?text=Shoes+Image';

    document.getElementById('mainImage').src = img;
    document.getElementById('productName').textContent = name;
    document.getElementById('productPrice').textContent = '$' + price;

    function selectSize(btn) {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = btn.textContent;
    }

    function flyToCart(image) {
      const cartIcon = document.getElementById('cartIcon');
      const imgClone = image.cloneNode(true);
      imgClone.classList.add('flying-img');

      const imgRect = image.getBoundingClientRect();
      imgClone.style.left = imgRect.left + 'px';
      imgClone.style.top = imgRect.top + 'px';
      imgClone.style.width = image.offsetWidth + 'px';
      imgClone.style.height = image.offsetHeight + 'px';
      document.body.appendChild(imgClone);

      const cartRect = cartIcon.getBoundingClientRect();
      setTimeout(() => {
        imgClone.style.left = cartRect.left + 'px';
        imgClone.style.top = cartRect.top + 'px';
        imgClone.style.width = '25px';
        imgClone.style.height = '25px';
        imgClone.style.opacity = '0.6';
      }, 100);

      setTimeout(() => {
        imgClone.remove();
        alert("Product added to cart!");
      }, 1100);
    }

    document.getElementById('addToCartBtn').addEventListener('click', () => {
      if (!selectedSize) return alert("Please select a size!");
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.push({ name: `${name} (Size ${selectedSize})`, price, image: img, quantity: 1 });
      localStorage.setItem("cart", JSON.stringify(cart));
      flyToCart(document.getElementById('mainImage'));
    });

    document.getElementById('buyNowBtn').addEventListener('click', () => {
      if (!selectedSize) return alert("Please select a size!");
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.push({ name: `${name} (Size ${selectedSize})`, price, image: img, quantity: 1 });
      localStorage.setItem("cart", JSON.stringify(cart));
      window.location.href = "payment.html";
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
